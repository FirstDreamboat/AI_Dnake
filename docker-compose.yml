# 狄耐克AI驱动嵌入式测试用例自动生成平台 - 一键部署
# 用法：docker compose up -d --build
version: "3.9"

services:
  mysql:
    image: mysql:8.4
    container_name: testgen-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: testgen_root_1234
      MYSQL_DATABASE: ai_testcase
      MYSQL_USER: testgen
      MYSQL_PASSWORD: testgen_1234
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    # 宿主 3306 可能已被本机 MySQL 占用，映射到 3307 便于调试；无需外部访问时可删除 ports 段
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  backend:
    build: ./backend
    container_name: testgen-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - DATABASE_URL=mysql+pymysql://testgen:testgen_1234@mysql:3306/ai_testcase?charset=utf8mb4
      # 视觉模型开关：需求文档内嵌原型图解析需要；须同时配置 VISION_API_KEY（backend/.env）
      - VISION_ENABLED=true
      - LOGIN_CAPTCHA_ENABLED=true
      - LOGIN_MAX_ATTEMPTS=5
      - LOGIN_LOCK_MINUTES=15
    volumes:
      - testgen-data:/app/data
      - testgen-uploads:/app/uploads
    expose:
      - "8000"

  frontend:
    build: ./frontend
    container_name: testgen-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"
    environment:
      - VITE_API_BASE=/api

volumes:
  mysql-data:
  testgen-data:
  testgen-uploads:
